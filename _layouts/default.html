<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% seo %}
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#0a0e0c; --panel:#111815; --fg:#e6efe9; --muted:#8fa79a;
      --accent:#3ddc84; --border:#1f2a25; --code:#0d1411;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:820px; margin:0 auto; padding:0 20px}
    header.site{
      border-bottom:1px solid var(--border); padding:22px 0; margin-bottom:8px;
    }
    header.site .wrap{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
    header.site a.brand{font-weight:700; font-size:1.15rem; color:var(--fg)}
    header.site .tag{color:var(--muted); font-size:.9rem}
    header.site nav{margin-left:auto; font-size:.92rem}
    main{padding:24px 0 64px}
    h1,h2,h3{line-height:1.25; color:#f2f8f4}
    h1{font-size:2rem; margin:.2em 0 .3em}
    h2{font-size:1.4rem; margin:1.8em 0 .5em; border-bottom:1px solid var(--border); padding-bottom:.3em}
    h3{font-size:1.12rem; margin:1.4em 0 .4em}
    p,ul,ol{margin:.7em 0}
    img{max-width:100%; border:1px solid var(--border); border-radius:8px; background:#fff}
    figure{margin:1.4em 0} figcaption{color:var(--muted); font-size:.85rem; text-align:center; margin-top:.5em}
    code{background:var(--code); padding:.15em .4em; border-radius:4px; font-size:.9em}
    pre{background:var(--code); border:1px solid var(--border); border-radius:8px; padding:14px; overflow:auto}
    pre code{background:none; padding:0}
    blockquote{border-left:3px solid var(--accent); margin:1em 0; padding:.2em 1em; color:var(--muted); background:var(--panel)}
    table{border-collapse:collapse; width:100%; margin:1.2em 0; font-size:.94rem}
    th,td{border:1px solid var(--border); padding:8px 10px; text-align:left}
    th{background:var(--panel)}
    .post-meta{color:var(--muted); font-size:.9rem; margin-bottom:1.4em}
    .post-list{list-style:none; padding:0}
    .post-list li{padding:18px 0; border-bottom:1px solid var(--border)}
    .post-list .date{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums}
    .post-list h2{border:none; margin:.15em 0 .3em; font-size:1.25rem}
    .post-list p{margin:.3em 0 0; color:var(--muted)}
    footer.site{border-top:1px solid var(--border); color:var(--muted); font-size:.85rem; padding:22px 0; margin-top:40px}
    footer.site a{color:var(--muted)}
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">Du7 Engineering</a>
      <span class="tag">infrastructure · cloud · IoT</span>
      <nav><a href="/">Posts</a> · <a href="https://du7.dev">du7.dev</a></nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  <footer class="site">
    <div class="wrap">
      © {{ site.time | date: '%Y' }} Du7 Technology Services ·
      <a href="https://github.com/eduelias">github.com/eduelias</a>
    </div>
  </footer>
</body>
</html>
